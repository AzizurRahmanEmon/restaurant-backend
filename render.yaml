services:
  - type: web
    name: restaurant-backend
    runtime: node
    # Added region - highly recommended to prevent deploy errors
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true # Best practice for security if not provided
      - key: JWT_EXPIRE
        value: 7d
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Zestify <onboarding@resend.dev>" # Wrapped in quotes due to special characters
